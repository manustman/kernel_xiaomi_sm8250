name: Build Kernel (Alioth)

on:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория ядра
        uses: actions/checkout@v7
        with:
          ref: test
          fetch-depth: 0
          submodules: recursive 
          
      - name: Установка необходимых зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            zlib1g-dev libncurses5-dev libncursesw5-dev libsqlite3-dev \
            git ccache zip unzip curl wget tar zstd lz4 liblz4-tool \
            python3 python3-pip python-is-python3

      - name: Настройка симлинков Python
        run: |
          sudo rm -f /usr/bin/python /usr/bin/python2
          sudo ln -s /usr/bin/python3 /usr/bin/python
          sudo ln -s /usr/bin/python3 /usr/bin/python2
          python --version
          python2 --version

      - name: Загрузка и размещение mkdtboimg
        run: |
          wget -q https://android.googlesource.com/platform/system/libufdt/+archive/refs/heads/main/utils.tar.gz
          tar -xvf utils.tar.gz src/mkdtboimg.py
          mv src/mkdtboimg.py ./mkdtboimg.py
          rm -rf src utils.tar.gz
          chmod +x mkdtboimg.py

          mkdir -p scripts/dtc/
          cp mkdtboimg.py scripts/dtc/mkdtboimg
          cp mkdtboimg.py scripts/mkdtboimg
          
          sudo cp mkdtboimg.py /usr/local/bin/mkdtboimg
          sudo cp mkdtboimg.py /usr/local/bin/mkdtboimg.py

      - name: Скачивание и распаковка Neutron Clang
        run: |
          mkdir -p clang
          curl -LO https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst
          tar -I zstd -xf neutron-clang-06092026.tar.zst -C clang/
          rm neutron-clang-06092026.tar.zst

      - name: Сборка ядра LLVM/Clang Only
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"

          MAKE_ARGS=(
            ARCH=arm64
            SUBARCH=arm64
            CC=clang
            LLVM=1
            LLVM_IAS=1
          )

          make "${MAKE_ARGS[@]}" alioth_defconfig
          make "${MAKE_ARGS[@]}" olddefconfig
          make -j$(nproc --all) "${MAKE_ARGS[@]}" Image dtbs dtbo.img

      - name: Поиск и объединение DTB файлов
        run: |
          mkdir -p out_dtb
          find arch/arm64/boot/dts/ -type f -name "*.dtb" -exec cp {} out_dtb/ \;
          cat out_dtb/*.dtb > out_dtb/dtb
          ls -lh out_dtb/dtb

      - name: Упаковка артефактов в ZIP
        run: |
          mkdir -p build_artifacts

          if [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image build_artifacts/
          elif [ -f arch/arm64/boot/Image.gz ]; then
            cp arch/arm64/boot/Image.gz build_artifacts/
          fi

          if [ -f arch/arm64/boot/dtbo.img ]; then
            cp arch/arm64/boot/dtbo.img build_artifacts/
          fi

          if [ -f out_dtb/dtb ]; then
            cp out_dtb/dtb build_artifacts/
          fi

          cd build_artifacts
          zip -r ../kernel-alioth-$(date +%Y%m%d-%H%M).zip ./*
          cd ..

      - name: Отправка артефакта в GitHub Actions
        uses: actions/upload-artifact@v7
        with:
          name: kernel-alioth-build
          path: kernel-alioth-*.zip
